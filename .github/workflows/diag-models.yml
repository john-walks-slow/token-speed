name: Diag model lists (temp)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install httpx==0.27.0
      - name: List models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import httpx, json
          for name, url, key in [
              ("GROQ", "https://api.groq.com/openai/v1/models", "GROQ_API_KEY"),
              ("GEMINI", "https://generativelanguage.googleapis.com/v1beta/openai/models", "GEMINI_API_KEY"),
          ]:
              try:
                  import os
                  r = httpx.get(url, headers={"Authorization": f"Bearer {os.environ[key]}"}, timeout=30)
                  print(f"===== {name} {r.status_code} =====")
                  if r.status_code == 200:
                      for m in r.json().get("data", []):
                          print(m["id"])
                  else:
                      print(r.text[:500])
              except Exception as e:
                  print(f"===== {name} ERROR {e} =====")
          PY
