name: Token Speed Patrol

on:
  schedule:
    # 每 6 小时巡检一次，错开整点（13 分）规避 GitHub Actions 整点拥堵
    - cron: '13 */6 * * *'
  workflow_dispatch: # 手动触发，用于首次验证与按需重跑

permissions:
  contents: write # 需要提交巡检结果到仓库

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install httpx
        run: pip install httpx==0.27.0

      - name: Run patrol
        env:
          # 按 config/patrol.json 中 api_key_env 名注入密钥
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m backend.patrol_runner

      - name: Commit patrol results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/patrol/data/
          git commit -m "patrol: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git push
